<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Insultni Bashorat Qilish - Yangi Bemor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container my-5">
    <h2 class="mb-4">Yangi Bemor Uchun Insult Bashorati Formasi</h2>
    <div class="card shadow">
        <div class="card-body">
            <form id="patientForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="gender" class="form-label">Jinsi</label>
                        <select class="form-select" id="gender" name="gender" required>
                            <option value="">Jinsni tanlang</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="age" class="form-label">Yoshi</label>
                        <input type="number" min="0" max="120" class="form-control" id="age" name="age" required />
                    </div>
                    <div class="col-md-6">
                        <label for="hypertension" class="form-label">Qon bosimi yuqoriligi (gipertenziya)</label>
                        <select class="form-select" id="hypertension" name="hypertension" required>
                            <option value="">Tanlang</option>
                            <option value="0">Yo‘q</option>
                            <option value="1">Ha</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="heart_disease" class="form-label">Yurak kasalligi</label>
                        <select class="form-select" id="heart_disease" name="heart_disease" required>
                            <option value="">Tanlang</option>
                            <option value="0">Yo‘q</option>
                            <option value="1">Ha</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="ever_married" class="form-label">Turmush qurganmi?</label>
                        <select class="form-select" id="ever_married" name="ever_married" required>
                            <option value="">Tanlang</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="work_type" class="form-label">Ish turi</label>
                        <select class="form-select" id="work_type" name="work_type" required>
                            <option value="">Tanlang</option>
                            <option value="Private">Private</option>
                            <option value="Self-employed">Self-employed</option>
                            <option value="Govt_job">Govt_job</option>
                            <option value="Children">Children</option>
                            <option value="Never_worked">Never_worked</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="Residence_type" class="form-label">Yashash joyi turi</label>
                        <select class="form-select" id="Residence_type" name="Residence_type" required>
                            <option value="">Tanlang</option>
                            <option value="Urban">Urban</option>
                            <option value="Rural">Rural</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="avg_glucose_level" class="form-label">O'rtacha glyukoza darajasi</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="avg_glucose_level" name="avg_glucose_level" required />
                    </div>
                    <div class="col-md-6">
                        <label for="bmi" class="form-label">BMI</label>
                        <input type="number" step="0.1" min="0" class="form-control" id="bmi" name="bmi" required />
                    </div>
                    <div class="col-md-6">
                        <label for="smoking_status" class="form-label">Chekish holati</label>
                        <select class="form-select" id="smoking_status" name="smoking_status" required>
                            <option value="">Tanlang</option>
                            <option value="formerly smoked">formerly smoked</option>
                            <option value="never smoked">never smoked</option>
                            <option value="smokes">smokes</option>
                            <option value="Unknown">Unknown</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary mt-4">Insult xavfini aniqlash</button>
            </form>

            <div id="result" class="mt-4" style="display:none;">
                <h4>Natija:</h4>
                <p><strong>Insult xavfi:</strong> <span id="strokePrediction"></span></p>
                <p><strong>Insult ehtimoli:</strong> <span id="strokeProbability"></span></p>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('patientForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const formData = new FormData(this);
    const data = {};
    formData.forEach((value, key) => {
        data[key] = value;
    });

    try {
        const response = await fetch('/apps/1', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await response.json();

        document.getElementById('strokePrediction').textContent = result.prediction === 1 ? "Insult xavfi bor" : "Insult xavfi yo‘q";
        document.getElementById('strokeProbability').textContent = (result.probability_of_stroke * 100).toFixed(2) + "%";
        document.getElementById('result').style.display = 'block';
    } catch (error) {
        alert('Bashorat qilishda xatolik yuz berdi: ' + error.message);
    }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
